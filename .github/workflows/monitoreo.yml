name: Monitoreo Licitaciones - Detectar novedades

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Detectar IDs nuevos y validar cobertura
        run: python generar_pendientes.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pendientes_clasificacion.json metadata.json
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar"
          else
            git commit -m "Actualizar pendientes de clasificacion"
            git push
          fi
