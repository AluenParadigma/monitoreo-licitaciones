name: Generar actualizacion monitoreo

on:
  workflow_dispatch:
  schedule:
    # 11:15 UTC = 08:15 Argentina (UTC-3)
    - cron: '15 11 * * *'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests openai

      - name: Generar JSON del monitoreo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generar_actualizacion.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualizacion_monitoreo.json historial_ids.json metadata.json
          if git diff --cached --quiet; then
            echo "Sin cambios para publicar"
          else
            git commit -m "Actualizar monitoreo diario"
            git push
          fi
